        price: '0.40'
        target: 4000
      LAPIS_LAZULI:
        price: '0.75'
        target: 3000
      BREAD:
        price: '2.50'
        target: 1000
      COOKED_BEEF:
        price: '3.50'
        target: 1000

  # --- Town creation and claim charges ---
  costs:
    townCreation: '0'
    territoryClaimPerPower: '0'

  # --- Daily town and nation upkeep ---
  upkeep:
    townPerClaimPerDay: '0'
    nationPerTownPerDay: '0'

  # --- Treasury plunder on capture ---
  plunder:
    perClaimPower: '0'
    maxPercentOfTreasury: 50

  # --- Port economy settings ---
  ports:
    maxFee: '1000'

# ==========================================
# War rules and rally caps
# ==========================================

# --- War mode and wartime permissions ---
oldWarSystem: true
warPermissions: true
canLeaveTownDuringWar: true
canCreateTownDuringWar: false
canDestroyTownDuringWar: false
canLeaveNationDuringWar: false
canSetCapitalDuringWar: true
canSetCapitalIfEnemies: true
canClaimDuringWar: true
canSphereDuringWar: false

# --- War warmup, sickness and admission ---
warmupPeriod: 86400000
warSickness: false
warPlayerWhiteList: false
whitelistDenyCommand: kick %player%

# --- Town and nation rally caps ---
rallyCapEnabled: false
rallyCapSize: 10
rallyCapApplyToNations: true

# ==========================================
# Flag attacks and explosions
# ==========================================

# --- Explosions and chest protection ---
restrictExplosions: true
onlyAllowExplosionsDuringWar: true
explodeChests: true

# --- Flag no-build area ---
flagNoBuildDistance: 2
flagNoBuildYOffset: 0

# --- Capture time by territory ---
chunkAttackTime: 1200
chunkAttackHomeTime: 6000
chunkAttackTimeSphere: 900
chunkAttackFromWastelandMultiplier: 2.0
chunkAttackHomeMultiplier: 2.0

# --- Concurrent attacks and allied flags ---
maxPlayerChunkAttacks: 1
maxConcurrentAttacks: 0
maxAttacksPerTown: 0
allowBreakingAlliesFlags: false

# --- Flag materials and placement ---
flagTopBlockMaterial: COBBLED_DEEPSLATE
flagBeaconSize: 6
flagBeaconMinSkyLevel: 100
flagBeaconSkyLevel: 50
flagPlacementMinHeight: 30
flagPlacementMaxHeight: 220

# --- Flag visuals and boss bar ---
displayEntityBeacon: false
attackBossBarShowTimeRemaining: true
staticFlagblock: true
staticFlagblockMaterial: deepslate

# --- Capture bonuses and flagged-chunk rules ---
playersInChunkMultiplier: true
allowUnownedAttack: true
disableFlagRespawner: false
allowAllInteractsInFlaggedChunks: false

# --- Skirmish rules ---
allowDestructionDuringSkirmish: false
allowBorderSkirmishFromWilderness: true

# ==========================================
# Raids and supply lines
# ==========================================

# --- Border raids ---
raid:
  enabled: false

  # --- Preparation, duration and eligibility ---
  prepMinutes: 15
  liveMinutes: 30
  cancelDefenderWinWindowMinutes: 5
  cooldownMinutes: 120
  minDefenderOnline: 1

  # --- Town-income rewards by winner ---
  attackerReward: {}
  defenderReward: {}

# --- Supply routes and cut-off territory penalties ---
supplyLines:
  enabled: false

  # --- Income and capture time multipliers ---
  cutIncomeMultiplier: 0.25
  cutCaptureTimeMultiplier: 0.5

  # --- Blockades and wasteland routes ---
  chunkBlockFraction: 0.5
  wastelandRoutes: true

# ==========================================
# Truces, surrender and conquest
# ==========================================

# --- Truce and occupation duration ---
trucePeriod: 86400000
conquestPeriod: 259200000
plunderPeriod: 259200000

# --- Plunder and surrender ---
plunderAmount: 25
newStyleSurrenderConquer: false
peaceNonWarTargets: false
onlyKeepCapital: false

# --- Annexation rules and whitelists ---
annexDisabled: false
canOnlyAnnexDuringWar: true
instantAnnexOnCapture: true
onlyWhitelistCanAnnex: true
onlyWhitelistCanClaim: true

# --- Occupied home travel and capital claims ---
occupiedHomeTeleportMultiplier: 12.0
disableClaimingCapital: false

# ==========================================
# PvP, friendly fire and mob protection
# ==========================================

# --- Town PvP switching and cooldown ---
togglePVPMechanic: true
canToggleTownPVP: true
pvpToggleCooldown: 259200000

# --- Friendly fire ---
allowAllyFriendlyFire: true
allowNationFriendlyFire: false
noFriendlyFire: false

# --- Mob and animal protection ---
mobProtection: false
protectedMobs:
  - COW
  - SHEEP
protectedMobsIfPVPOff:
  - HORSE
  - SKELETON_HORSE
  - DONKEY
  - MULE

  # ==========================================
  # Outposts and ports
  # ==========================================

# --- Outpost warp times, text and cost ---
outpostWarpTimeTier1: 60.0
outpostWarpTimeTier2: 30.0
outpostWarpTimeTier3: 15.0
miningoutpostText:
  line1: '&bmining outpost'
  line2: '&3ore area'
  line3: '&7mine safely'
outpostTeleportCost:
  diamond: 1
  gold: 16

# --- Port navigation and warp times ---
seaLevel: 62.0
portWarpTime: 5.0
portWarpTimeTier1: 30.0
portWarpTimeTier2: 15.0
portWarpTimeTier3: 5.0

# --- Boat requirement and town port policies ---
allowPortWarpWithoutBoat: false
portNotInShipMultiplier: 1.0
portTownPolicies: false

# ==========================================
# Map exports and Dynmap
# ==========================================

