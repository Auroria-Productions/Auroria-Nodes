# Nodes configuration
# Categories are comment headings. Settings keep their existing key paths.
# 1 second = 20 server ticks. 1 minute = 60000 ms. 1 hour = 3600000 ms.

# ==========================================
# Engine settings
# ==========================================
# savePeriod and mainPeriodicTick are in server ticks. backupPeriod is in milliseconds.

# --- Configuration schema and world selection ---
configVersion: 7
selectedWorld: world
disableWorldWhenLoadFails: true

# --- Saving, backups and scheduled tasks ---
savePeriod: 600
backupPeriod: 3600000
mainPeriodicTick: 1200

# ==========================================
# Map bounds and minimap
# ==========================================

# --- Minimap refresh ---
minimapUpdateFreqTicks: 20

# --- Map coordinate bounds ---
bottomLeftX: -50000
bottomLeftZ: -50000
topRightX: 50000
topRightZ: 50000

# --- Minimap size ---
minimap:
  defaultSize: 5
  minSize: 3
  maxSize: 6

  # --- Size by online player count ---
  onlineScaling:
    enabled: true
    rules:
      - minPlayers: 200
        minSize: 3
        maxSize: 6
      - minPlayers: 300
        minSize: 3
        maxSize: 5
      - minPlayers: 500
        minSize: 3
        maxSize: 4

# --- Sidebar text ---
minimapSidebarTopText: ''
minimapSidebarBottomText: ''
enableSidebarTextOnlyOnMaxSize: true

# ==========================================
# Nametags
# ==========================================

# --- Nametag providers ---
usePacketNametags: true
useUnlimitedNametags: false

# --- Refresh intervals and batch size ---
nametagUpdatePeriod: 100
nametagUpdateInterval: 2
nametagUpdatesPerTick: 20

# --- Distance-based visibility ---
nametagProximityEnabled: false
nametagProximityRadius: 176.0
nametagProximityRefreshTicks: 100
nametagProximityDistance: 176.0

# ==========================================
# Tab list
# ==========================================

# --- Tab list switches and refresh ---
tabEnabled: true
tabRefreshTicks: 40

# --- Staff detection ---
tabStaffWeightThreshold: 60
tabStaffWeightPlaceholder: '%luckperms_meta_weight%'
tabStaffFallbackPermission: nodes.staff

# --- Column sizes and spacing ---
tabColumnWidth: 24
tabMaxEntriesPerColumn: 8
tabFooterRows: 18
tabFallbackSpacerRows: 8

# --- Tab list layout and formatting ---
tabList:
  enabled: true

  # --- Refresh intervals by section ---
  updateIntervals:
    staff: 100
    town: 40
    allies: 40
    enemies: 20
    headerFooter: 20

  # --- Column headings and colours ---
  columnHeaders:
    staff: <gradient:#FFAA50:#FFD080><bold>STAFF</bold></gradient>
    town: <gradient:#7DD4FF:#A0E0FF><bold>TOWN</bold></gradient>
    allies: <gradient:#77DD77:#A0EEA0><bold>ALLIES</bold></gradient>
    enemies: <gradient:#FF7070:#FFA0A0><bold>ENEMIES</bold></gradient>

  # --- Header, footer and image ---
  header:
    - '&6&lNODES'
    - '&7{town}'
  footer:
    - '&7Online: &f%online%'
  headerImageChar: ''

  # --- Staff groups and icons ---
  staffPermissions:
    admin:
      permission: nodes.staff.admin
      prefix: '<#FFCC50>✦ '
      color: <#FFDD80>
    mod:
      permission: nodes.staff.mod
      prefix: '<#50C8FF>✦ '
      color: <#70D8FF>
    helper:
      permission: nodes.staff.helper
      prefix: '<#D4A0FF>✦ '
      color: <#E0B0FF>

  # --- Player entries and ping ---
  showTownBeforeNation: true
  maxPlayersPerSection: 8
  showPlayerPing: false

# --- Tab list pipeline and player tags ---
tablist:
  enabled: true
  pipeline-ticks: 10
  update-interval-ticks: 100
  refresh-on-join: true
  refresh-others-on-join: true
  join-refresh-delay-ticks: 2

  # --- Team and town tag text ---
  team-prefix: tp
  show-town-tag: true
  tag-open: '['
  tag-close: '] '

  # --- LuckPerms tags ---
  luckperms:
    enabled: true
    show-suffix: false
    separator: ''

  # --- Header and footer ---
  header:
    enabled: true
    lines:
      - '&6&lNODES'
      - '&7{town}'
    townless-text: '&7[Wild]'
  footer:
    enabled: true
    lines:
      - '&7Online: &f{online}'

  # --- Player groups ---
  groups:
    staff:
      enabled: true
      min-weight: 50
      header: '&6&lStaff '
    town:
      enabled: true
      header: '&a&lTown / Nation '
    ally:
      enabled: true
      header: '&e&lAllies '
    enemy:
      enabled: true
      header: '&c&lEnemies '
    neutral:
      enabled: true
      header: '&7&lEveryone else '

  # --- Wilderness and diplomacy colours ---
  townless:
    tag-color: GRAY
    tag-text: Wild
    bold: false
  relations:
    self:
      tag-color: GREEN
      bold: false
    nation:
      tag-color: AQUA
      bold: false
    ally:
      tag-color: YELLOW
      bold: false
    enemy:
      tag-color: RED
      bold: false
    neutral:
      tag-color: WHITE
      bold: false

# ==========================================
# AFK and activity
# ==========================================

# --- Idle timeout and inactivity threshold ---
afkKickTime: 900000
maxDaysForInactivity: 30

# --- Playtime requirement for war ---
hoursRequiredToJoinWars: 0

# --- Daily event schedule ---
dailyEventTime: '12:00'

# ==========================================
# General permissions and world protection
# ==========================================

# --- Wilderness and unclaimed territory ---
canInteractInEmpty: false
canInteractInUnclaimed: true
requireSheepNodeToShear: true

# --- Block glitch detection and penalties ---
punishBlockGlitching: true
punishBlockGlitchingDurationTicks: 60
punishBlockGlitchingPoisonAmplifier: 1
punishBlockGlitchingBlindnessAmplifier: 255
punishBlockGlitchingDarknessAmplifier: 255
punishBlockGlitchingAttempts: 5
punishBlockGlitchingWindowTicks: 60
antiBlockGlitchAttempts: 5

# --- Redstone and region restrictions ---
disableRedstoneTicking: false
enableRegionLimits: false
limitPVPByRegion: false

# ==========================================
# Town settings
# ==========================================
# townSpawnTime is in seconds. Duration formats depend on the individual key.

# --- Creation, relocation and rename cooldowns ---
townCreateCooldown: 172800000
townMoveHomeCooldown: 86400000
townRenameCooldown: 10s
townCooldownUpdateTick: 1200

# --- Town spawn and rejoining ---
townSpawnTime: 10
townRejoinCooldownEnabled: false
townRejoinCooldown: 86400000

# --- Town points and shop ---
townPointsPerPlayerPerMinute: 1
townShopFile: town_shop.yml

# --- Town creation cost and spacing ---
townCreateCostEnabled: false
townCreateCostFlatFee: 500.0
townCreationCost: 0
minimumDistanceForNewTown: false
minimumDistanceForNewTownVal: 32

# --- Waypoints and GUI ---
enableWaypoints: false
skullsGUIToggle: 1

# --- Leader launch limits ---
leaderlaunch:
  defaultSlots: 10
  maxSlots: 30

# --- Town member actions ---
town-control:
  leave-enabled: true
  spawn-enabled: true
  capital-enabled: false
  disband-enabled: false

# ==========================================
# Nation settings and diplomacy
# ==========================================

# --- Nation travel and membership ---
allowNationTownSpawn: false
nationTownTeleportCost:
  diamond: 1
  gold: 6
nationJoinCooldown: 2d

# --- Diplomatic distance controls ---
maxDistanceWarDeclaration: false
maxDistanceAlliance: false
maxDiplomaticDistance: 90000

# --- Alliance and war proximity ---
allyProximity: false
allyProximityDistance: 1500
warProximity: false
warProximityDistance: 1500.0

# ==========================================
# Vassalage & Tributaries
# ==========================================
# Both types use /nation vassal|tributary offer|accept|decline|release|break.
# Vassals follow their overlord's wars; tributaries remain autonomous.
# Taxes shown in offers are percentages (20 = 20 percent).
# --- Vassalage and tributary switches ---
enableVassals: true
enableTributaries: true
# Maximum negotiable rates for tributary agreements (percent).
# --- Tributary tax limits ---
maxResourceTributaryTaxRate: 30
maxEcoTributaryTaxRate: 20

# Vassal-specific settings. tributeRate 0.2 means 20% by default
# for new vassal agreements; explicit offered rates override it.
# Existing agreements retain the negotiated rates already saved.
# --- Vassal terms and income ---
vassals:
  enabled: true
  # fraction of vassal income paid to the overlord by default
  tributeRate: 0.2
  # earliest a new vassal may use /vassal revolt or /nation vassal break
  revoltCooldownHours: 72
  # pending offer expiry; applies to vassal and tributary offers
  offerTimeoutSeconds: 120

# ==========================================
# Fortified nodes
# ==========================================
# /t fortify upgrades the territory you're in. Costs and upkeep
# come from the town's fortification treasury. Members deposit
# configured materials using /t fortify deposit [amount].
# Upkeep runs every incomePeriod; if it cannot be paid, the level
# drops by one. Enemy flag capture time is multiplied by the value.
# Configured materials can be customised; levels can be added/removed.
# --- Fortification material and level rules ---
fortify:
  enabled: true

  # --- Costs and upkeep by level ---
  levels:
    1:
      captureTimeMultiplier: 1.25
      cost:
        IRON_BLOCK: 8
      upkeep:
        IRON_INGOT: 4
    2:
      captureTimeMultiplier: 1.5
      cost:
        GOLD_BLOCK: 8
      upkeep:
        GOLD_INGOT: 4
    3:
      captureTimeMultiplier: 2.0
      cost:
        DIAMOND_BLOCK: 4
      upkeep:
        DIAMOND: 2

# ==========================================
# Town claims and territory costs
# ==========================================

# --- Claim costs and claim power ---
territoryCostBase: 10
territoryCostScale: 0.25
claimsPowerEnabled: true
territoryCostEnabled: true

# --- Starting and maximum town claim power ---
townInitialClaims: 25
initialOverClaimsAmountScale: 2
townClaimsBase: 20
townClaimsMax: -1

# --- Claim power earned by residents ---
playerClaimsInitial: 1
playerClaimsMax: 25
playerClaimsIncrease: 2
townPenaltyDecay: 2
townClaimsPenaltyDecayPeriod: 3600000
playerClaimsIncreasePeriod: 3600000

# --- Overclaim penalties and reminders ---
overClaimsPenalty: true
overClaimsMaxPenalty: 0.5
overClaimsAllowClaim: false
overMaxClaimsReminderPeriod: 24000

# --- Claim cooldown and rate limits ---
townClaimCooldownEnabled: false
townClaimCooldownPeriod: 86400000
townClaimCooldownMaxClaims: 3
townClaimPlayerRatioEnabled: false
townClaimPlayerRatioPerPlayer: 1

# --- Town claim cap and fee ---
maxClaimsPerTown: 0
territoryClaimCost: 0

# ==========================================
# Node types and special territory rules
# ==========================================

# --- Node definitions file ---
nodeTypeFile: nodeType.yml

# --- Core, claimed and sphere nodes ---
enableCoreMechanics: false
coreNodeCostIncrease: 16
enableClaimedMechanics: false
claimedNodeCostIncrease: 16
enableSphereMechanics: false
sphereNodeCostIncrease: 16

# ==========================================
# Resource income, ores, crops and breeding
# ==========================================
# incomePeriod is in milliseconds.

# --- Income interval and claim-power scaling ---
incomeEnabled: true
incomePeriod: 3600000
incomeScaleByClaimPower: true
incomeScaleMin: 0.1
incomeScaleMax: 1.0

# --- Global and territory resource values ---
globalResources:
  income:
    gold_ingot: 0 # Present for reference compatibility; preserves original disabled global income.
  ore:
    coal:
      - 0.03
      - 1
      - 3
    iron_ore:
      - 0.015
      - 1
      - 2
    gold_ore:
      - 0.015
      - 1
      - 1
    diamond_ore: 0.007
    prismarine_shard:
      chance: 0.0
      min: 0
      max: 0
      lore:
        - §aAncient fossil
        - §2Mined deep from the earth
      customname: §bAncient Fossils
  crops:
    wheat: 0.25
    potato: 0.25
  animals: null
useTerritoryResourceValues: true

# --- Hidden ores and harvesting rules ---
hiddenOreMechanic: true
hiddenOreSilktouch: false
cropgrowthMechanic: true

# --- Resource access by territory ownership ---
allowOreInWilderness: false
allowCropsInWilderness: false
allowBreedingInWilderness: false
allowOreInCaptured: true
allowOreInNationTowns: true

# --- Light and height requirements ---
cropsMinSkyLight: 14
breedingMinSkyLight: 14
cropsMinYHeight: 16
cropsMaxYHeight: 255
breedingMinYHeight: 16
breedingMaxYHeight: 255

# ==========================================
# Taxes and tribute
# ==========================================

# --- Occupation tax rates ---
taxIncomeRate: 0.2
taxMineRate: 0.2
taxFarmRate: 0.2
taxAnimalRate: 0.2

# --- Town taxation and distance effects ---
enableTaxation: true
enableResourceTaxation: false
maxResourceTaxRate: 40
maxResourceConqueredTaxRate: 60
taxDistancePenaltyMinimum: 96
taxDistancePenaltyRamp: 0.01090476

# --- Money tax limits ---
enableEcoTaxation: false
maxEcoTaxRate: 30
maxEcoConqueredTaxRate: 50

# ==========================================
# Economy, deposits and upkeep
# ==========================================

# --- Core economy and deposit locations ---
enableEconomy: true
townDepositOnlyInHome: true
nationDepositOnlyInHome: true
plotDepositOnlyInHome: true

# --- Town, nation and plot upkeep ---
upkeepMultiplier: 0
nationUpkeepMultiplier: 0
plotUpkeepBillingPeriod: 14d
plotUpkeepBillingExpiry: 3d
townLevyBillingExpiry: 3d

# --- Town and economy safeguards ---
coreSafety:
  deleteInsolventTowns: false

# ==========================================
# Integrated economy
# ==========================================

# --- Integrated economy switch and tradable resources ---
economy:
  enabled: true
  resources:
    - COAL
    - IRON_INGOT
    - COPPER_INGOT
    - GOLD_INGOT
    - DIAMOND
    - EMERALD
    - REDSTONE
    - LAPIS_LAZULI

  # --- Loan limits, terms and interest ---
  loans:
    maximum: '10000'
    periodHours: 24
    termPeriods: 30
    interestBasisPoints: 100

  # --- Infrastructure upkeep by type ---
  infrastructure:
    railway: '5.00'
    port: '20.00'
    road: '1.00'
    power: '10.00'

  # --- Transfer fees and daily taxes ---
  fees:
    transferPercent: 0
    marketPercent: 0
  tax:
    townPercentPerDay: 0

  # --- Server buyback and vote rewards ---
  sell:
    dailyLimit: '0'
    prices:
      COAL: '0.50'
      IRON_INGOT: '2.00'
      COPPER_INGOT: '1.00'
      GOLD_INGOT: '4.00'
      DIAMOND: '20.00'
      EMERALD: '15.00'
      REDSTONE: '0.25'
      LAPIS_LAZULI: '0.50'
  vote:
    reward: '0'

  # --- Player market and server shop ---
  market:
    enabled: true
    maxListingsPerPlayer: 10
    maxPrice: '1000000'
  shop:
    prices:
      COAL: '1.00'
      IRON_INGOT: '4.00'
      COPPER_INGOT: '2.00'
      GOLD_INGOT: '8.00'
      DIAMOND: '40.00'
      EMERALD: '30.00'
      REDSTONE: '0.50'
      LAPIS_LAZULI: '1.00'
      BREAD: '2.00'
      COOKED_BEEF: '3.00'

  # --- Dynamic exchange prices and stock ---
  exchange:
    enabled: true
    restockMinutes: 30
    restockPercent: 20
    sensitivity: 0.5
    minMultiplier: 0.25
    maxMultiplier: 4.0
    spreadPercent: 20
    capMultiplier: 4

    # --- Exchange items, prices and target stock ---
    items:
      COAL:
        price: '0.75'
        target: 4000
      IRON_INGOT:
        price: '3.00'
        target: 2000
      COPPER_INGOT:
        price: '1.50'
        target: 3000
      GOLD_INGOT:
        price: '6.00'
        target: 1000
      DIAMOND:
        price: '30.00'
        target: 300
      EMERALD:
        price: '22.00'
        target: 300
