dynmapdir: plugins/dynmap/web/nodes
dynmapnodesconfig: plugins/dynmap/web/nodes/config.json
dynmapworld: plugins/dynmap/web/nodes/world.json
dynmaptowns: plugins/dynmap/web/nodes/towns.json
dynmapNameoverrides: plugins/dynmap/web/nodes/nameoverrides.json
# Installer for the Nodes editor and viewer.
