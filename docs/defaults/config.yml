rallyOverview:
  enabled: true
  bindAddress: 0.0.0.0
  webPort: 8096
  samplePeriodMs: 60000
  historyDays: 30

  # --- Rally page layout and sorting ---
  pageTitle: Nation Rally Stats
  defaultLastHours: 24
  maxRows: 200
  autoRefreshSeconds: 30
  sortBy: avg

# --- Town market website ---
marketOverview:
  enabled: true
  bindAddress: 0.0.0.0
  webPort: 8097
  historyDays: 60

  # --- Market page layout and sorting ---
  pageTitle: Town Market Overview
  defaultLastHours: 24
  maxRows: 200
  autoRefreshSeconds: 30
  sortBy: units

# ==========================================
# Calendar and exploration
# ==========================================

# --- Calendar and event announcements ---
calendar:
  enabled: true
  timezone: ''
  dailyAnnounceTime: '12:00'

  # --- Join messages and reminders ---
  showOnJoin: true
  remindMinutes: 10
  catchUpMinutes: 30
  announcementHours: 24

# --- Discovery range and activation ---
poi:
  enabled: true
  checkTicks: 40
  defaultRadius: 12
  activationDelaySeconds: 120

  # --- Discovery announcements and visibility ---
  announceFirstDiscovery: true
  showTotal: true

  # --- Discovery rewards by type ---
  defaultMoney:
    village: '5'
    ruin: '5'
    cave: '5'
    shrine: '10'
    shipwreck: '5'
    dungeon: '15'
    camp: '10'

  # --- Milestone titles ---
  milestones:
    5: '&7Wanderer'
    10: '&aExplorer'
    25: '&bPathfinder'
    50: '&6Cartographer'

# ==========================================
# Skills and progression
# ==========================================

# --- XP rates and level curve ---
skills:
  enabled: true
  xpMultiplier: 1.0
  maxLevel: 50
  baseXp: 50
  levelExponent: 1.5

  # --- Bonus drops and HUD ---
  extraDropPercentPerLevel: 0.5
  extraDropPercentMax: 25
  showActionBar: true

  # --- Mining XP ---
  mining:
    xp:
      COAL_ORE: 2
      COPPER_ORE: 2
      IRON_ORE: 3
      GOLD_ORE: 4
      LAPIS_ORE: 3
      REDSTONE_ORE: 3
      EMERALD_ORE: 8
      DIAMOND_ORE: 10
      NETHER_QUARTZ_ORE: 3
      NETHER_GOLD_ORE: 2
      ANCIENT_DEBRIS: 15

  # --- Farming XP ---
  farming:
    xp:
      WHEAT: 2
      CARROTS: 2
      POTATOES: 2
      BEETROOTS: 2
      NETHER_WART: 3
      MELON: 3
      PUMPKIN: 3

  # --- Woodcutting XP ---
  woodcutting:
    xpPerLog: 2

  # --- Hunting XP ---
  hunting:
    animalXp: 1
    monsterXp: 2
    xp:
      ENDERMAN: 5
      WITCH: 6

  # --- Titles earned by skill level ---
  titles:
    mining:
      10: '&7Prospector'
