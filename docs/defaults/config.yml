    title: §8§l⚑ §r§6§lTown Contracts §8§l⚑
    border_common: GRAY_STAINED_GLASS_PANE
    border_uncommon: YELLOW_STAINED_GLASS_PANE
    border_rare: PURPLE_STAINED_GLASS_PANE

  # --- Contract feedback messages ---
  messages:
    not_in_town: You must be in a town to view contracts.
    already_done: You already completed that contract this cycle.
    missing_items: 'Missing items: {amount}x {material}'
    success: 'Contract completed: {contract}!'
    reward_added: 'Rewards added to town income: {rewards}'
    system_disabled: Town contracts are currently disabled.

  # --- Contract source ---
  use_custom_contracts_only: false

# --- Town item market currencies and listing limits ---
market:
  allowed-currencies:
    - DIAMOND
    - GOLD_INGOT
    - IRON_INGOT
    - EMERALD
    - NETHERITE_INGOT
