# ==========================================
# Duels, bounties and supply drops
# ==========================================

# --- Duel requests, countdown and time limit ---
duel:
  enabled: true
  requestSeconds: 60
  countdownSeconds: 5
  maxSeconds: 300

  # --- Wagers and Elo ratings ---
  allowWager: true
  maxWager: 0
  eloStart: 1000
  eloK: 32

  # --- Kits, announcements and command permissions ---
  kitOnly: false
  defaultKit: ''
  announce: true
  allowedCommands:
    - msg
    - tell
    - w
    - r
    - reply

# --- Payouts and contribution limits ---
bounties:
  enabled: true
  rewardDestination: TOWN_INCOME
  townlessPlayerFallback: true
  maxStacksPerBounty: 36
  maxContributionsPerTarget: 100

  # --- Accepted reward materials ---
  allowedMaterials:
    - DIAMOND
    - EMERALD
    - COAL
    - RAW_IRON
    - RAW_GOLD
    - RAW_COPPER
    - LAPIS_LAZULI
    - REDSTONE
    - QUARTZ
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - NETHER_GOLD_ORE
    - NETHER_QUARTZ_ORE
    - ANCIENT_DEBRIS

  # --- Preset reward packages ---
  packages:
    diamonds:
      - DIAMOND:16
    emeralds:
      - EMERALD:32
    mixed-ores:
      - RAW_IRON:64
      - RAW_GOLD:16
      - DIAMOND:8

  # --- Eligibility and cooldowns ---
  minimumAgeSeconds: 60
  placementCooldownSeconds: 30
  claimCooldownSeconds: 3600
  minimumAccountAgeSeconds: 3600

  # --- Abuse checks and disabled worlds ---
  blockSameTown: true
  blockSameNation: true
  blockAllies: true
  blockSameIp: true
  disabledWorlds: []

  # --- Bounty announcements ---
  broadcastPlacement: true
  broadcastClaims: true

# --- Drop schedule, warnings and despawn ---
supplyDrops:
  enabled: true
  intervalMinutes: 180
  jitterMinutes: 30
  warningSeconds: 300
  despawnMinutes: 20
  fallHeight: 60

  # --- Claim timer, loot and participation ---
  claimSeconds: 60
  claimRadius: 4.0
  itemsPerDrop: 3
  minPlayersOnline: 5
  discord: true

# ==========================================
# Chat and placeholders
# ==========================================

# --- PlaceholderAPI integration ---
placeholderapiEnabled: true

# --- Local and roleplay chat ranges ---
localChatDistance: 100.0
rpChatDistance: 100.0

# --- Chat prefix and formatting ---
greenText: true
chatPrefixSuffixShow: true
chatPrefixMode: 0
chatPrefix: ''

# --- Hover text ---
chatJSONFormattingHoverTown: ''
chatJSONFormattingHoverPlayer: ''
chatJSONFormattingHoverPrepend: ''

# ==========================================
# Discord and message templates
# ==========================================

# --- Discord integration and relay switches ---
activateDiscord: false
relayWar: false
relayGlobalChat: false
relayFlagWar: false
relayThirdParty: false
relayTownUpkeepDeletions: true

# --- Discord channels ---
warChannelName: wars
globalChatChannelName: chat-relay
flagWarChannelName: flagwar
thirdPartyPlaceholderName: colonies

# --- Relay prefixes ---
warMessagePrefix: __**War**__ »
globalChatMessagePrefix: Global »
flagWarMessagePrefix: __**FlagWar**__ »
thirdPartyPlaceholderMessagePrefix: __**Colonies**__ »

# --- Conquest, surrender and war messages ---
messageTownPlunder: '**%surrendertown%** has been conquered and plundered by **%invader%**'
messageTownConquer: '**%surrendertown%** has been conquered by **%invader%**'
messageJoinWar: ':heavy_plus_sign: **%nation%** joined war against **%defender%**!'
messageEnd: The war between **%nation%** and **%defender%** has ended.
messageSurrender: '**%surrendertown%** has surrendered to **%invader%**.'
messageWarDeclare: ':crossed_swords: **%attacker%** declared war against **%defender%**!'

# --- Flag attack and capture messages ---
messageFlagWarAttack: '[War] %player% is liberating %townattacked% at (%x%, %y%, %z%)'
messageFlagWarAttackLiberate: '[War] %player% is attacking %townattacked% at (%x%,
  %y%, %z%)'
messageFlagWarDefend: '[War] Attack at (%x%, %y%, %z%) defeated by %player%'
messageFlagWarLiberateTerritory: '[War] %attacker% liberated territory (id=%id%) from
  %occupier%!'
messageFlagWarCaptureTerritory: '[War] %attacker% captured territory (id=%id%) from
  %town%!'
messageFlagWarSucceedLiberate: '[War] %attacker% liberated chunk (%x%, %z%) from %occupier%!'
messageFlagWarSucceedDefend: '[War] %attacker% defended chunk (%x%, %z%) against %occupier%!'
messageFlagWarSucceedCapture: '[War] %attacker% captured chunk (%x%, %z%) from %town%!'

# ==========================================
# Discord webhooks and event relays
# ==========================================

# --- War and flag webhooks ---
discordWebhookWar: ''

discordWebhookFlagWar: ''

discordRelayWar: true

discordRelayFlagWar: true

# --- Raid and warzone webhooks ---
discordWebhookRaids: ''

discordWebhookWarzones: ''

discordRelayRaids: true

discordRelayWarzones: true

# ==========================================
# SQL audit storage
# ==========================================

# --- Database audit switch and connection ---
enableSQL: false
sql:
  ip: localhost
  port: 3306
  database: nodes
  username: root
  password: password

# Tertiary staff-supervised war mode; independent of classic/NodesWar.
# Enabled by default for new installations; existing server choices are preserved.
war:
  enabled: true
  keyPointWars:
    enabled: true
    stateFile: data/war/key-point-battles.json
    defaultRadius: 96
    maxRadius: 256
    maxPointsPerWar: 12
    warSicknessSeconds: 600
    abandonOnExit: true
