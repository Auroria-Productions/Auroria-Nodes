nodesWeb:
  webRoot: plugins/dynmap/web
  publicUrl: ''

# ==========================================
# Town contracts and market
# ==========================================

# --- Town contract cycles, slots and rewards ---
contracts:
  enabled: true
  cycle_duration_minutes: 180
  slots:
    common: 3
    uncommon: 2
    rare: 1
  reward_multiplier: 1.0
  broadcast_on_complete: false
  broadcast_format: '{player} completed a contract for {town}: {contract}'

  # --- Contract inventory appearance ---
