main: phonon.nodes.NodesPlugin
name: milzzynodes
description: A towny-like plugin with a focus on performance and extensibility, designed
  for large servers with many players and towns.
authors:
- phonon
contributors:
- Fond__
- RobinSGE3361
- Sakyq
- dfah
version: 1.21-26.3-core-dev.5.11-refinery1182-keywarcfg
conflicts:
- Towny
- TownyAdvanced
- TownyChat
- TownyNameUpdater
- TownyFlight
- TownyFly
- TownyEssentials
- TownyMobs
- TownyNations
- TownyTowns
- TownyWar
api-version: '1.21'
depend:
- Vault
folia-supported: false
softdepend:
- kotlin
- Essentials
- PlaceholderAPI
- TAB
- LuckPerms
- SuperVanish
- PremiumVanish
- ports
- DiscordSRV
- JMWaypointManager
- UnlimitedNametags
- Votifier
commands:
  keywar:
    description: Staff-supervised one-life key-point wars
    aliases: [kpwar, keypointwar]
    permission: nodes.command.keywar
    usage: /keywar help
  nodesadmin:
    description: Admin commands for Nodes
    aliases:
    - nda
    permission: nodes.helper
    usage: /nodesadmin help or /nda help
  minebuff:
    description: Admin commands for Nodes
    permission: nodes.admin
  minebufftown:
    description: Town-specific minebuff command
    permission: nodes.admin
  town:
    description: Manage player towns (Nodes)
    aliases:
    - t
    permission: nodes.command.town
    usage: /town help or /t help
  vassal:
    description: Vassal independence command
    permission: nodes.command.nation
    usage: /vassal revolt
    aliases:
    - vassals
  nation:
    description: Manage player nations (Nodes)
    aliases:
    - n
    permission: nodes.command.nation
    usage: /nation help or /n help
  nodes:
    description: Nodes general info (Nodes)
    aliases:
    - nd
    permission: nodes.command.nodes
    usage: /nodes help or /nd help
  noptions:
    description: Manage minimap and chat preferences
    aliases: []
    permission: nodes.command.options
    usage: /noptions
  ally:
    description: Make alliance with another town/nation
    aliases: []
    permission: nodes.command.ally
    usage: /ally help
  unally:
    description: Break alliance with another town/nation
    aliases: []
    permission: nodes.command.unally
    usage: /unally help
  war:
    description: Declare war on another town/nation
    aliases: []
    permission: nodes.command.war
    usage: /war help
  warzone:
    description: Manage warzones (Nodes)
    permission: nodes.command.warzone
    usage: /warzone [name]
  captime:
    description: Show cap time for a node id
    aliases: []
    permission: nodes.command.captime
    usage: /captime [nodeId]
  peace:
    description: Request peace with another town/nation
    aliases: []
    permission: nodes.command.peace
    usage: /peace help
  truce:
    description: View truce list and times remaining
    aliases: []
    permission: nodes.command.truce
    usage: /peace help
  globalchat:
    description: Set player chat to global
    aliases:
    - gc
    permission: nodes.command.chat.global
    usage: /globalchat or /gc
  townchat:
    description: Set player chat to town
    aliases:
    - tc
    permission: nodes.command.chat.town
    usage: /townchat or /tc
  nationchat:
    description: Set player chat to nation
    aliases:
    - nc
    permission: nodes.command.chat.nation
    usage: /nationchat or /nc
  allychat:
    description: Set player chat to allies
    aliases:
    - ac
    permission: nodes.command.chat.ally
    usage: /allychat or /ac
  localchat:
    description: Talk to players within 100 blocks
    aliases:
    - lc
    permission: nodes.command.chat.local
    usage: /localchat or /lc
  player:
    description: View player info
    aliases:
    - p
    permission: nodes.command.player
    usage: /player [name] or /p [name]
  territory:
    description: View territory info
    aliases: []
    permission: nodes.command.territory
    usage: /territory or /territory [id]
  port:
    description: Port warps
    aliases: []
    permission: nodes.command.port
    usage: /port help
  report:
    description: Report an issue to staff
    aliases: []
    permission: nodes.command.report
    usage: /report <message>
  language:
    description: Set personal language
    aliases:
    - lang
    permission: nodes.command.language
    usage: /language en|de|el|tr
  nekdr:
    description: Show kill/death statistics
    aliases:
    - kdr
    permission: nodes.command.nekdr
    usage: /nekdr [name|top]
  neadmin:
    description: Reload imported extensions
    aliases: []
    permission: nodesextensions.admin
    usage: /neadmin reload
  neincome:
    description: Show detailed town income info
    aliases: []
    permission: nodes.command.town
    usage: /neincome info
  nemarket:
    description: Town market command
    aliases: []
    permission: nodes.command.town
    usage: /nemarket help
  miningtower:
    description: Mining tower management
    aliases: []
    permission: nodesextensions.miningtower.submit
    usage: /miningtower
  miningtowerdebug:
    description: Mining tower debug command
    aliases: []
    permission: nodesextensions.miningtower.rate
    usage: /miningtowerdebug
  netowncontrol:
    description: Toggle town command availability
    aliases: []
    permission: nodesextensions.admin
    usage: /netowncontrol <status|leave|spawn> [enable|disable]
  calendar:
    description: Server calendar with the daily events
    permission: nodes.command.calendar
    usage: /calendar [today|upcoming]
  rpchat:
    description: Set player chat to roleplay (nearby players only)
    aliases:
    - rp
    permission: nodes.command.chat.rp
    usage: /rpchat or /rp
  duel:
    description: Challenge a player to a duel
    permission: nodes.command.duel
    usage: /duel <player> [kit|own] [wager], /duel accept|deny|spectate|leave|top|stats
  skills:
    description: Your mining, farming, woodcutting and hunting levels
    permission: nodes.command.skills
    usage: /skills or /skills top <skill>
  map:
    description: Places you have discovered
    permission: nodes.command.map
    usage: /map or /map title <name|none>
  captimes:
    description: Time to capture a chunk of a node
    permission: nodes.command.captimes
    usage: /captimes or /captimes [node id]
  refinery:
    description: Manage and use refineries
    aliases:
    - rf
    - refineries
    permission: nodes.command.refinery
    usage: /refinery help
  stats:
    description: View kill/death stats
    aliases:
    - kdr
    usage: /stats [player]
  leaderboard:
    description: KDR leaderboards
    aliases:
    - lb
    usage: /leaderboard <kills|deaths|kdr|towns|nations|war>
  plot:
    description: Town plots
    aliases:
    - p
    usage: /plot help
    permission: nodes.command.plot
    permission-message: You do not have permission to use plot commands.
  killshop:
    description: Kill event shop
    usage: /killshop
    permission: nodes.command.killshop
    permission-message: You do not have permission to use killshop.
  surrender:
    description: Join another nation with your town
    permission: nodes.command.surrender
    usage: /surrender <nation>
  bounty:
    description: Ore bounties on players
    aliases:
    - bounties
    permission: nodes.command.bounty
    usage: /bounty help
  economy:
    description: National economy and banking
    aliases:
    - ne
    permission: nodes.command.economy
    usage: /economy help
  economyadmin:
    description: Economy administration
    aliases:
    - nea
    permission: nodes.economy.admin
    usage: /economyadmin help
  supplydrop:
    description: Supply drops
    aliases:
    - sd
    permission: nodes.command.supplydrop
    usage: /supplydrop help
  raid:
    description: Territory raids
    usage: /raid <town> <territoryId> | status | cancel
    permission: nodes.command.raid
  resourcetower:
    description: Place and manage mining towers
    aliases:
    - mt
    permission: nodes.command.miningtower
    usage: /resourcetower help
permissions:
  nodes.command.keywar:
    description: Use /keywar
    default: true
  nodes.keywar.staff:
    description: Manage battle setup, roster, start and outcomes
    default: op
  nodes.staff:
    default: op
    children:
      nodes.admin: true
      nodes.mod: true
      nodes.helper: true
  nodes.helper:
    default: op
  nodes.mod:
    default: op
    children:
      nodes.helper: true
  nodes.admin:
    default: op
    children:
